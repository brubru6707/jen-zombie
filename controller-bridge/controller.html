<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>jenzombies controller</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171c24; --line:#2a323d; --ink:#e7edf3; --dim:#8b97a6;
    --green:#37d67a; --yellow:#f5c451; --red:#ec5b5b; --accent:#4aa3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;gap:12px;padding:16px;max-width:520px;margin:0 auto}
  h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
  .row{display:flex;align-items:center;gap:10px}
  .status{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;
    background:#3a1f22;color:var(--red);border:1px solid #5a2b2f}
  .status.on{background:#12321f;color:var(--green);border-color:#1e5233}
  .pad{position:relative;width:100%;aspect-ratio:1/1;background:var(--panel);
    border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .cross,.cross::before{position:absolute;background:var(--line)}
  .pad .h{left:8%;right:8%;top:50%;height:1px;position:absolute;background:var(--line)}
  .pad .v{top:8%;bottom:8%;left:50%;width:1px;position:absolute;background:var(--line)}
  .pad .dead{position:absolute;left:50%;top:50%;width:10%;height:10%;transform:translate(-50%,-50%);
    border:1px dashed #39424e;border-radius:50%}
  .dot{position:absolute;width:16%;height:16%;left:50%;top:50%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#7fc0ff,#2b6fc4);
    transform:translate(-50%,-50%);transition:transform .04s linear;
    box-shadow:0 0 18px rgba(74,163,255,.5)}
  .dot.attack{background:radial-gradient(circle at 35% 30%,#ffb0b0,#d23c3c);
    box-shadow:0 0 26px rgba(236,91,91,.7)}
  .readout{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;
    font-size:13px;color:var(--dim)}
  .readout b{color:var(--ink);font-weight:600}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 8px;text-align:center;font-size:12px;color:var(--dim);transition:.08s}
  .chip .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .chip .val{font-size:18px;font-weight:700;color:var(--ink);margin-top:2px}
  .chip.hit{background:#123a24;border-color:#1e5233;color:var(--green)}
  .chip.hit .val{color:var(--green)}
  .meter{display:flex;gap:8px}
  .lamp{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);background:#10151b;
    transition:.06s;opacity:.25}
  .lamp.g{--c:var(--green)} .lamp.y{--c:var(--yellow)} .lamp.r{--c:var(--red)}
  .lamp.lit{opacity:1;background:var(--c);box-shadow:0 0 16px var(--c)}
  .hint{font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
</style>
</head>
<body>
  <div class="row">
    <h1>jenzombies controller</h1>
    <span id="status" class="status">connecting</span>
  </div>

  <div class="pad">
    <div class="h"></div><div class="v"></div><div class="dead"></div>
    <div id="dot" class="dot"></div>
  </div>

  <div class="readout">
    <span>X <b id="rx">0.00</b></span>
    <span>Y <b id="ry">0.00</b></span>
    <span>rate <b id="hz">0</b>/s</span>
    <span>lat <b id="age">-</b>ms</span>
  </div>

  <div class="btns">
    <div id="c-sw"  class="chip"><div class="lab">stick</div><div class="val">-</div></div>
    <div id="c-atk" class="chip"><div class="lab">attack</div><div class="val">-</div></div>
    <div id="c-sens" class="chip"><div class="lab">sens</div><div class="val">-</div></div>
  </div>

  <div class="meter">
    <div id="l-g" class="lamp g"></div>
    <div id="l-y" class="lamp y"></div>
    <div id="l-r" class="lamp r"></div>
  </div>
  <div class="hint">Push the stick: the dot tracks it, buttons light on press, and the meter
    (green &rarr; yellow &rarr; red) is driven back to the board's real LEDs by how far you push.</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const dot = $("dot");
  let frames = 0, lastRateT = performance.now();
  let ws, lastLedSent = 0, lastLed = [-1,-1,-1];

  function meterLamps(level){        // mirrors game/audio.py meter_lamps()
    const lvl = Math.max(0, Math.min(1, level));
    const ramp = (a,b)=> b<=a ? (lvl>=b?1:0) : Math.max(0,Math.min(1,(lvl-a)/(b-a)));
    const audible = ramp(0,0.02), toY = ramp(0.28,0.38), toR = ramp(0.62,0.72);
    return [audible*(1-toY), toY*(1-toR), toR];
  }

  function setStatus(on){
    const s = $("status");
    s.textContent = on ? "controller live" : "waiting for controller";
    s.className = "status" + (on ? " on" : "");
  }

  function apply(st){
    // joystick dot: map -1..1 to pad, y inverted (up = negative already on wire)
    const px = 50 + st.x*42, py = 50 + st.y*42;
    dot.style.transform = `translate(-50%,-50%)`;
    dot.style.left = px + "%"; dot.style.top = py + "%";
    dot.classList.toggle("attack", !!st.atk);
    $("rx").textContent = st.x.toFixed(2);
    $("ry").textContent = st.y.toFixed(2);
    $("c-sw").classList.toggle("hit", !!st.sw);
    $("c-sw").querySelector(".val").textContent = st.sw ? "DOWN" : "up";
    $("c-atk").classList.toggle("hit", !!st.atk);
    $("c-atk").querySelector(".val").textContent = st.atk ? "FIRE" : "-";
    $("c-sens").classList.toggle("hit", st.sens>3000);
    $("c-sens").querySelector(".val").textContent = st.sens>3000 ? "HI" : "lo";
    setStatus(st.connected);
    if(st.ts){ const age = Math.max(0, Date.now()/1000 - st.ts)*1000;
      $("age").textContent = age<9999 ? age.toFixed(0) : "-"; }

    // close the loop: stick magnitude -> meter -> real board LEDs
    const mag = Math.min(1, Math.hypot(st.x, st.y));
    const [g,y,r] = meterLamps(mag);
    $("l-g").classList.toggle("lit", g>0.4);
    $("l-y").classList.toggle("lit", y>0.4);
    $("l-r").classList.toggle("lit", r>0.4);
    const now = performance.now();
    if(now - lastLedSent > 80){       // throttle LED writes to the board
      const q = [ +g.toFixed(2), +y.toFixed(2), +r.toFixed(2) ];
      if(q[0]!==lastLed[0]||q[1]!==lastLed[1]||q[2]!==lastLed[2]){
        if(ws && ws.readyState===1) ws.send(JSON.stringify({led:q}));
        lastLed = q; lastLedSent = now;
      }
    }
    frames++;
    if(now - lastRateT > 500){
      $("hz").textContent = Math.round(frames*1000/(now-lastRateT));
      frames = 0; lastRateT = now;
    }
  }

  function connect(){
    // wss on the HTTPS origin (the bridge upgrades WebSocket on every port),
    // plain ws elsewhere. ws:// against 8443 is an HTTP request on a TLS
    // port and only fills the bridge's journal with SSL errors.
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onmessage = e => { try{ const m = JSON.parse(e.data); if(m.t==="state") apply(m);}catch(_){} };
    ws.onclose = () => { setStatus(false); setTimeout(connect, 1000); };
    ws.onerror = () => ws.close();
  }
  connect();
})();
</script>
</body>
</html>
